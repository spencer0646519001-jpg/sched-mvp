<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Sched MVP UI</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, "Noto Sans", sans-serif; margin: 24px; }
    .row { margin: 10px 0; }
    label { display:block; font-weight:600; margin-bottom: 6px; }
    input, textarea { width: 520px; max-width: 100%; padding: 10px; }
    button { padding: 10px 16px; cursor: pointer; }
    pre { background:#f6f6f6; padding: 12px; border-radius: 8px; overflow:auto; }
    .hint { color:#666; font-size: 13px; }
    .error { color:#b00020; font-weight:600; }
  </style>
</head>

<body>
  <h1>Sched MVP – Generate Daily Run</h1>
  <p class="hint">POST to <code>/api/tenants/demo_kitchen/daily-runs/</code></p>

  <div class="row">
    <label for="date">Date (YYYY-MM-DD)</label>
    <input id="date" value="2026-01-06" />
  </div>

  <div class="row">
    <label for="absent">Absent (comma separated)</label>
    <input id="absent" value="Kim,Spencer" />
    <div class="hint">Example: <code>Kim,Spencer</code></div>
  </div>

  <div class="row">
    <button id="btn">Generate</button>
    <span id="status" class="hint"></span>
  </div>

  <div class="row">
    <div id="err" class="error"></div>
  </div>

  <h3>Response</h3>
  <pre id="out">{}</pre>

<script>
  const $ = (id) => document.getElementById(id);

  function parseAbsent(s) {
    return (s || "")
      .split(",")
      .map(x => x.trim())
      .filter(Boolean);
  }

  async function postJSON(url, body) {
    const resp = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });

    const text = await resp.text();
    let data = null;
    try { data = text ? JSON.parse(text) : null; } catch (_) {}

    if (!resp.ok) {
      // backend already returns present_api_error envelope
      const msg = (data && data.error && data.error.message) ? data.error.message : `HTTP ${resp.status}`;
      const code = (data && data.error && data.error.code) ? data.error.code : "http_error";
      const detail = data ? JSON.stringify(data, null, 2) : text;
      const err = new Error(`${code}: ${msg}`);
      err.detail = detail;
      throw err;
    }
    return data;
  }

  $("btn").addEventListener("click", async () => {
    $("err").textContent = "";
    $("status").textContent = "Running...";
    $("out").textContent = "{}";

    const date = $("date").value.trim();
    const absent = parseAbsent($("absent").value);

    try {
      // IMPORTANT: absolute path (avoid /api/ui/... relative bugs)
      const data = await postJSON("/api/tenants/demo_kitchen/daily-runs/", { date, absent });
      $("out").textContent = JSON.stringify(data, null, 2);
      $("status").textContent = "OK";
    } catch (e) {
      $("status").textContent = "ERROR";
      $("err").textContent = e.message;
      $("out").textContent = e.detail || String(e);
    }
  });
</script>
</body>
</html>
