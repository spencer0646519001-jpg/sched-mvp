services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
      - ALLOWED_HOSTS=127.0.0.1,localhost,0.0.0.0,web
    volumes:
      - .:/app
      - ./db.sqlite3:/app/db.sqlite3
    command: sh -c "python manage.py migrate && python manage.py seed_demo && python manage.py runserver 0.0.0.0:8000"
